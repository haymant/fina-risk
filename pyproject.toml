[project]
name = "fina-risk"
version = "0.1.0"
description = "fina-risk MCP orchestration skeleton: structured product pricing, AAD-first risk cubes, shared path simulation, portfolio risk and P&L"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mcp>=1.6,<2",
    "pydantic>=2.8,<3",
    "starlette>=0.40,<1",
]

[project.scripts]
fina-risk-mcp = "fina_risk:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1,<3",
    "httpx>=0.27,<1",
    "mypy>=1.11,<2",
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
    "uvicorn>=0.30,<1",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true