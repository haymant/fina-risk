[project]
name = "fina-risk-mcp"
version = "0.1.0"
description = "fina-risk MCP orchestration skeleton: structured product pricing, AAD-first risk cubes, shared path simulation, portfolio risk and P&L"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.1,<2",
    "mcp>=1.6,<2",
    "numpy>=2.0,<3",
    "pyarrow>=17,<22",
    "pydantic>=2.8,<3",
    "quantlib-risks>=1.33.3",
    "starlette>=0.40,<1",
    "fina-risk>=0.1.0",
]

[tool.uv.sources]
fina-risk = { path = "wheels/fina_risk-0.1.0-cp312-cp312-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl" }

[project.scripts]
fina-risk-mcp = "fina_risk:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fina_risk"
module-root = "src"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1,<3",
    "httpx>=0.27,<1",
    "mypy>=1.11,<2",
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
    "uvicorn>=0.30,<1",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
