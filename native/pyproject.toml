[build-system]
requires = ["scikit-build-core>=0.10,<1.0", "pybind11>=3.1,<4.0", "numpy>=2.0,<3", "cmake>=3.20", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "fina-risk"
version = "0.1.0"
description = "fina-risk native C++ parity kernel (pybind11): CRN bump-revalue worst-of PV/delta/gamma/taylor on a shared float32 terminal cube"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Traco Dev", email = "dev@lizhao.net" }]
keywords = ["structured", "pricing", "parity", "cpp", "pybind11", "benchmark", "risk"]
dependencies = ["numpy>=2.0,<3"]

[tool.scikit-build]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = []
wheel.expand-macos-universal-tags = false

[tool.scikit-build.cmake.define]
CMAKE_POSITION_INDEPENDENT_CODE = "ON"